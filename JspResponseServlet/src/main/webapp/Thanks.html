<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; user-select: none;
        background: linear-gradient(135deg, #ffecd2, #fcb69f, #ff9a9e, #a18cd1, #84fab0);
        background-size: 400% 400%;
        animation: drift 18s ease infinite;
    }
    @keyframes drift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* floating bubbles */
    .bubble {
        position: fixed; bottom: -80px; border-radius: 50%;
        background: rgba(255,255,255,.35);
        animation: rise linear infinite; pointer-events: none;
    }
    @keyframes rise {
        to { transform: translateY(-120vh) translateX(40px); opacity: 0; }
    }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    .card {
        position: relative; z-index: 2; text-align: center;
        padding: 3rem 3.5rem; border-radius: 32px;
        background: rgba(255,255,255,.55);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0,0,0,.18);
        animation: pop .8s cubic-bezier(.2,1.4,.4,1) both;
        max-width: 92vw;
    }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .emoji { font-size: clamp(2.5rem, 7vw, 4rem); animation: bounce 1.6s ease-in-out infinite; display: inline-block; }
    @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }

    h1 { font-size: clamp(2.8rem, 10vw, 6.5rem); margin: .1em 0 0; line-height: 1; }
    h2 { font-size: clamp(1.8rem, 7vw, 4rem); margin: .25em 0 0; word-break: break-word; }
    .sub { margin-top: 1.2rem; color: #555; font-size: clamp(.95rem, 2.5vw, 1.15rem); }

    .ch {
        display: inline-block; cursor: pointer; color: #2b2d42;
        transition: transform .2s, color .3s;
        animation: wave 2.4s ease-in-out infinite;
    }
    .ch:hover { transform: translateY(-10px) rotate(-8deg) scale(1.2); }
    @keyframes wave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .palette {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; padding: 10px 16px;
        background: #fff; border-radius: 40px; z-index: 6;
        box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 94vw; flex-wrap: wrap; justify-content: center;
    }
    .swatch {
        width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
        border: 3px solid #fff; box-shadow: 0 0 0 1px #bbb; transition: transform .15s;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { box-shadow: 0 0 0 3px #2b2d42; }
    .tool {
        border: none; background: #eee; border-radius: 20px;
        padding: 8px 14px; cursor: pointer; font-size: .85rem;
    }
    .tool:hover { background: #ddd; }

    .dot { position: fixed; border-radius: 50%; pointer-events: none; z-index: 4; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
    <div class="emoji">🎉</div>
    <h1 id="thanks">Thank you</h1>
    <h2 id="who">Friend</h2>
    <div class="sub">We received your details. Click the letters or anywhere on the page to paint!</div>
</div>

<div class="palette">
    <div class="swatch active" style="background:#e63946" data-c="#e63946"></div>
    <div class="swatch" style="background:#f4a261" data-c="#f4a261"></div>
    <div class="swatch" style="background:#f9c80e" data-c="#f9c80e"></div>
    <div class="swatch" style="background:#2a9d8f" data-c="#2a9d8f"></div>
    <div class="swatch" style="background:#457b9d" data-c="#457b9d"></div>
    <div class="swatch" style="background:#9b5de5" data-c="#9b5de5"></div>
    <div class="swatch" style="background:#ff6fb5" data-c="#ff6fb5"></div>
    <button class="tool" id="confettiBtn">🎊 Confetti</button>
    <button class="tool" id="reset">Reset</button>
</div>

<script>
    // ---- Name comes from the URL: thankyou.html?name=Asha ----
    const params = new URLSearchParams(location.search);
    const name = (params.get("name") || "").trim();
    if (name) document.getElementById("who").textContent = name;   // textContent = safe, no HTML injection

    // ---- Split text into clickable letters ----
    function splitLetters(el, offset) {
        const text = el.textContent;
        el.textContent = "";
        [...text].forEach((c, i) => {
            const s = document.createElement("span");
            s.className = "ch";
            s.style.animationDelay = ((i + offset) * 0.08) + "s";
            s.textContent = c === " " ? "\u00A0" : c;
            el.appendChild(s);
        });
    }
    splitLetters(document.getElementById("thanks"), 0);
    splitLetters(document.getElementById("who"), 10);

    // ---- Palette ----
    let current = "#e63946";
    document.querySelectorAll(".swatch").forEach(sw => sw.addEventListener("click", e => {
        e.stopPropagation();
        document.querySelector(".swatch.active").classList.remove("active");
        sw.classList.add("active");
        current = sw.dataset.c;
    }));

    document.querySelectorAll(".ch").forEach(ch => ch.addEventListener("click", e => {
        e.stopPropagation();
        ch.style.color = current;
        splash(e.clientX, e.clientY);
    }));

    document.body.addEventListener("click", e => {
        if (e.target.closest(".palette")) return;
        splash(e.clientX, e.clientY);
    });

    document.getElementById("reset").addEventListener("click", e => {
        e.stopPropagation();
        document.querySelectorAll(".ch").forEach(c => c.style.color = "");
    });

    // ---- Paint splash ----
    function splash(x, y) {
        for (let i = 0; i < 14; i++) {
            const d = document.createElement("div");
            const size = 8 + Math.random() * 14;
            d.className = "dot";
            d.style.cssText = `width:${size}px;height:${size}px;background:${current};left:${x}px;top:${y}px;`;
            document.body.appendChild(d);
            const a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 80;
            d.animate([
                { transform: "translate(0,0) scale(1)", opacity: 1 },
                { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px) scale(.2)`, opacity: 0 }
            ], { duration: 700, easing: "ease-out" }).onfinish = () => d.remove();
        }
    }

    // ---- Floating bubbles ----
    for (let i = 0; i < 18; i++) {
        const b = document.createElement("div");
        const size = 20 + Math.random() * 60;
        b.className = "bubble";
        b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}vw;` +
                          `animation-duration:${8 + Math.random() * 12}s;animation-delay:${Math.random() * 10}s;`;
        document.body.appendChild(b);
    }

    // ---- Confetti ----
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [], running = false;
    const colors = ["#e63946", "#f4a261", "#f9c80e", "#2a9d8f", "#457b9d", "#9b5de5", "#ff6fb5"];

    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function burst() {
        for (let i = 0; i < 160; i++) {
            pieces.push({
                x: innerWidth / 2, y: innerHeight / 3,
                vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 4,
                size: 6 + Math.random() * 8, rot: Math.random() * 6,
                vr: (Math.random() - .5) * .4,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }
        if (!running) { running = true; requestAnimationFrame(tick); }
    }

    function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.vy += .35; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .6);
            ctx.restore();
        });
        pieces = pieces.filter(p => p.y < canvas.height + 40);
        if (pieces.length) requestAnimationFrame(tick); else running = false;
    }

    document.getElementById("confettiBtn").addEventListener("click", e => { e.stopPropagation(); burst(); });
    setTimeout(burst, 500);   // celebrate on load
</script>
</body>
</html>
